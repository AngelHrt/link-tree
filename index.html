<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    >

    <title>DPR IAN LINKS</title>
</head>

<body>

    <main class="profile-card">

        <!-- PROFILE -->
        <section class="profile">

            <div class="profile-image">
                <img
                    src="dprian.jpg"
                    alt="DPR IAN"
                >

                <div class="profile-info">
                    <h1>DPR IAN</h1>
                    <p>Singer &amp; Songwriter</p>
                </div>
            </div>


            <!-- SMALL ICONS -->
            <div class="profile-actions">

                <a href="https://www.youtube.com/dreamperfectregime" aria-label="Spotify">
                    <i class="ti ti-brand-youtube"></i>
                </a>
                
                <a href="https://open.spotify.com/intl-es/artist/2o8gT0fQmFxGNbowbdgeZe?si=jngiYk5eRh6DZ82nLvzsow" aria-label="Play">
                    <i class="ti ti-brand-spotify"></i>
                </a>
                
                <a href="https://www.instagram.com/dprian/" aria-label="Play">
                    <i class="ti ti-brand-instagram"></i>
                </a>
                
                
            </div>
            
        </section>
        
        
        <!-- SOCIAL LINKS -->
        <section class="links">
            
            <a
            href="https://www.youtube.com/dreamperfectregime"
            target="_blank"
            class="link youtube"
            >
            <span class="link-icon">
                <i class="ti ti-brand-youtube"></i>
            </span>
            
            <span class="link-name">
                YOUTUBE
                </span>
            </a>

            <a
                    href="https://open.spotify.com/intl-es/artist/2o8gT0fQmFxGNbowbdgeZe?si=jngiYk5eRh6DZ82nLvzsow"
                    class="link spotify"
                >
                    <span class="link-icon">
                        <i class="ti ti-brand-spotify"></i>
                    </span>
        
                    <span class="link-name">
                        SPOTIFY
                    </span>
            </a>

            <a
                href="https://www.instagram.com/dprian/"
                target="_blank"
                class="link instagram"
            >
                <span class="link-icon">
                    <i class="ti ti-brand-instagram"></i>
                </span>

                <span class="link-name">
                    INSTAGRAM
                </span>
            </a>


            <a
                href="https://x.com/DPRIAN_"
                target="_blank"
                class="link twitter"
            >
                <span class="link-icon">
                    <i class="ti ti-brand-x"></i>
                </span>

                <span class="link-name">
                    TWITTER (X)
                </span>
            </a>


            <a
                href="https://www.tiktok.com/@mito.is.real"
                target="_blank"
                class="link tiktok"
            >
                <span class="link-icon">
                    <i class="ti ti-brand-tiktok"></i>
                </span>

                <span class="link-name">
                    TIKTOK
                </span>
            </a>

        </section>


        <!-- FOOTER -->
        <footer class="footer">

            <div class="footer-links">

                <a href="#">
                    Privacy Policy
                </a>

                <a href="#">
                    Terms of Service
                </a>

                <a href="#">
                    Press Kit
                </a>

            </div>

            <p class="copyright">
                © 2026 DPR IAN. ALL RIGHTS RESERVED.
            </p>

        </footer>

    </main>

</body>
</html>
